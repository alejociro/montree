<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montree · Panel de administración</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14301f; --green:#12A150; --green-d:#0E7C3E; --green-100:#E3F0E7; --green-50:#EFF6F0;
  --cream:#F6F0E6; --card:#FFFDF9; --line:#E4DDCD; --line-2:#EFE9DC;
  --text:#1B1D18; --muted:#767B70; --danger:#B4562A; --danger-50:#F7E6DC; --warn:#B98A17;
  --r:14px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--cream);color:var(--text);font-family:"Plus Jakarta Sans",system-ui,sans-serif;
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;text-wrap:pretty}
h1,h2,h3,h4{margin:0;font-weight:600;letter-spacing:-.015em}
a{color:var(--green-d);text-decoration:none}
a:hover{color:var(--ink)}
button{font-family:inherit;color:inherit}
svg{display:block}
.mono{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase}
.serif{font-family:"Instrument Serif",Georgia,serif;font-weight:400}
.hidden{display:none !important}

/* shell */
.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{background:var(--ink);color:#cfdbcf;padding:18px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh}
.logo{font-family:"Instrument Serif",serif;font-size:19px;color:#f4efe2;letter-spacing:.03em;padding:4px 10px}
.side .mono{color:#7d9686;padding:0 10px}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav a{display:flex;align-items:center;gap:11px;color:#cfdbcf;padding:9px 10px;border-radius:9px;font-size:13.5px}
.side nav a svg{stroke:#9fb4a4;width:16px;height:16px;flex:none}
.side nav a:hover{background:#1f4630;color:#fff}
.side nav a:hover svg{stroke:#fff}
.side nav a[aria-current="page"]{background:#22503a;color:#fff;font-weight:600}
.side nav a[aria-current="page"] svg{stroke:#7FD8A2}
.side .who{margin-top:auto;display:flex;gap:10px;align-items:center;border-top:1px solid #2b4a36;padding-top:14px;font-size:12.5px}
.avatar{width:30px;height:30px;border-radius:50%;background:#2f6b45;color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:80;background:#f6f0e6e6;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;gap:20px;padding:11px 30px}
.crumbs{display:flex;gap:9px;align-items:center;color:var(--muted);font-size:13px}
.page{padding:26px 30px 76px;max-width:1460px;width:100%}

/* generic */
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:30px}
.head p{margin:5px 0 0;color:var(--muted);max-width:64ch}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 18px;font-size:13.5px;font-weight:600;
  cursor:pointer;border:1px solid transparent}
.btn.p{background:var(--green);color:#fff}
.btn.p:hover{background:var(--green-d)}
.btn.p svg{stroke:#fff}
.btn.g{background:var(--card);color:var(--text);border-color:var(--line)}
.btn.g:hover{background:var(--green-50);border-color:var(--green-100)}
.btn.d{background:var(--card);color:var(--danger);border-color:var(--danger-50)}
.btn.d:hover{background:var(--danger-50)}
.btn.d svg{stroke:var(--danger)}
.btn.sm{padding:7px 13px;font-size:12.5px}
.btn.xs{padding:5px 11px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:15px;height:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.pad{padding:20px 22px}
.tag{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:600;white-space:nowrap}
.t-ok{background:var(--green-100);color:#14301f}
.t-live{background:var(--ink);color:#EDF6EF}
.t-warn{background:#FBEFD3;color:#7A5A05}
.t-off{background:#EDEAE0;color:#5F625A}
.t-due{background:var(--danger-50);color:var(--danger)}
.bar{height:6px;background:var(--line-2);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--green);border-radius:99px}
.bar.full i{background:var(--ink)}
.bar.zero i{background:var(--line)}
.iconbtn{border:0;background:none;padding:7px;border-radius:9px;cursor:pointer;color:var(--muted)}
.iconbtn:hover{background:var(--green-50);color:var(--text)}
.iconbtn svg{stroke:currentColor;width:16px;height:16px}
.field label{display:block;font-size:12.5px;font-weight:600;margin-bottom:6px}
input,select,textarea{width:100%;font-family:inherit;font-size:14px;color:var(--text);background:var(--card);
  border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--green);box-shadow:0 0 0 3px var(--green-100)}
input::placeholder,textarea::placeholder{color:#A3A69C}
.hint{color:var(--muted);font-size:12px;margin-top:5px}
.req{color:var(--danger)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-title{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:26px 0 14px}
.sec-title h2{font-size:19px}
.sec-title p{margin:3px 0 0;color:var(--muted);font-size:13px}
.sec-title .mono{color:var(--muted)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:40px 22px;text-align:center;color:var(--muted);font-size:13px;background:var(--card)}
.empty b{display:block;color:var(--text);font-size:16px;margin-bottom:5px}
.note{border-left:3px solid var(--green);background:var(--green-50);border-radius:0 10px 10px 0;padding:11px 14px;font-size:12.5px}
.note.warn{border-left-color:var(--danger);background:var(--danger-50)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:20px}
.kpi{padding:15px 17px;background:var(--card);border:1px solid var(--line);border-radius:var(--r)}
.kpi .mono{color:var(--muted);display:block}
.kpi b{display:block;font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:5px}
.kpi small{color:var(--muted);font-size:12px}
.kpi.alert{background:var(--danger-50);border-color:#EBD3C4}
.kpi.alert b{color:var(--danger)}

/* filtros: buscador largo arriba, pestañas abajo, selects a la derecha */
.filterbar{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px 4px;margin-bottom:18px}
.searchwide{position:relative;margin-bottom:12px}
.searchwide input{padding-left:40px;height:44px;font-size:14.5px;background:#FDFBF5}
.searchwide .ic{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:var(--muted)}
.searchwide .ic svg{stroke:currentColor;width:17px;height:17px}
.searchwide .n{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted)}
.frow{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line-2);padding:9px 0 10px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:0;background:none;font-size:12.5px;font-weight:600;color:var(--muted);padding:8px 14px;border-radius:999px;cursor:pointer;
  display:inline-flex;gap:7px;align-items:center}
.seg button:hover{background:var(--green-50);color:var(--text)}
.seg button[aria-selected="true"]{background:var(--ink);color:#f4efe2}
.seg .c{font-size:11px;background:var(--line-2);border-radius:99px;padding:0 6px;color:var(--muted)}
.seg button[aria-selected="true"] .c{background:#2c5540;color:#dcebe0}
.picks{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.pick{display:flex;gap:8px;align-items:center}
.pick .mono{color:var(--muted)}
.pick select{width:auto;min-width:118px;padding:8px 11px;font-size:13px;border-radius:999px;background:#FDFBF5}

/* tabla */
.tablewrap{border:1px solid var(--line);border-radius:var(--r);overflow:auto;background:var(--card)}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:860px}
thead th{position:sticky;top:0;background:#FBF7EE;text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;
  color:var(--muted);font-weight:600;padding:11px 16px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:3}
thead th.r{text-align:right}
tbody td{padding:14px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#FBF7EE}
tbody tr.off td{opacity:.62}
td.r{text-align:right}
.tname{font-size:14.5px;font-weight:600;display:block;min-width:150px}
.tsub{color:var(--muted);font-size:11.5px;display:block;margin-top:2px}
.when{display:flex;gap:11px;align-items:center}
.datebox{width:46px;flex:none;text-align:center;border:1px solid var(--line);border-radius:10px;padding:5px 0;background:#FBF7EE}
.datebox b{display:block;font-size:17px;line-height:1.1}
.datebox span{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:"IBM Plex Mono",monospace}
.when .w b{display:block;font-size:13px}
.when .w small{color:var(--muted);font-size:11.5px;display:block}
.price{font-size:15px;font-weight:700;white-space:nowrap}
.price small{display:block;color:var(--muted);font-size:11px;font-weight:500}
.who{display:flex;gap:9px;align-items:center}
.who .av{width:28px;height:28px;border-radius:50%;background:var(--green-100);color:#14301f;display:grid;place-items:center;
  font-weight:700;font-size:11px;flex:none}
.who b{display:block;font-size:13px;font-weight:600}
.who small{color:var(--muted);font-size:11px}
.occ{min-width:150px}
.occ .row{display:flex;justify-content:space-between;gap:10px;font-size:12px;margin-bottom:5px}
.occ .row b{font-size:12.5px}
.occ .row span{color:var(--muted)}
.tfoot{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 16px;border-top:1px solid var(--line);
  background:#FBF7EE;font-size:12.5px;color:var(--muted)}

/* menú de acciones */
.menu{position:fixed;z-index:900;background:var(--card);border:1px solid var(--line);border-radius:12px;min-width:206px;
  padding:6px;display:none;box-shadow:0 24px 50px -26px rgba(20,48,31,.55)}
.menu.on{display:block}
.menu .mh{padding:7px 10px 8px;color:var(--muted);border-bottom:1px solid var(--line-2);margin-bottom:5px}
.menu button{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:center;width:100%;border:0;background:none;
  text-align:left;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:500;cursor:pointer}
.menu button svg{stroke:var(--muted);width:16px;height:16px}
.menu button:hover{background:var(--green-50)}
.menu button:hover svg{stroke:var(--green-d)}
.menu button.danger{color:var(--danger)}
.menu button.danger svg{stroke:var(--danger)}
.menu button.danger:hover{background:var(--danger-50)}

/* fichas logística */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.rescard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column}
.rescard:hover{border-color:#CFC7B4;box-shadow:0 14px 34px -28px rgba(20,48,31,.5)}
.rescard .top{display:flex;gap:12px;align-items:flex-start;padding:16px 16px 10px}
.glyphbox{width:38px;height:38px;border-radius:11px;background:var(--green-50);border:1px solid var(--green-100);display:grid;place-items:center;flex:none}
.glyphbox svg{stroke:var(--green-d);width:18px;height:18px}
.rescard h3{font-size:15.5px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rescard .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.rescard .desc{color:var(--muted);font-size:12.5px;padding:0 16px 12px;margin:0}
.rescard dl{margin:0;padding:0 16px 14px;display:grid;grid-template-columns:auto 1fr;gap:7px 14px;font-size:12.5px}
.rescard dt{color:var(--muted)}
.rescard dd{margin:0;font-weight:500;text-align:right}
.rescard .foot{margin-top:auto;border-top:1px solid var(--line-2);background:#FDFBF5;padding:11px 14px;
  display:flex;justify-content:space-between;align-items:center;gap:10px;border-radius:0 0 var(--r) var(--r)}
.rescard .use{font-size:12px;color:var(--muted)}
.newcard{border:1.5px dashed var(--line);border-radius:var(--r);background:#FDFBF5;display:grid;place-items:center;padding:24px;
  cursor:pointer;color:var(--muted);text-align:center;font-family:inherit;font-size:12.5px;min-height:150px}
.newcard:hover{border-color:var(--green);color:var(--green-d);background:var(--green-50)}
.newcard b{display:block;font-size:14.5px;color:var(--text);margin-bottom:4px}
.newcard:hover b{color:var(--green-d)}

/* modal / drawer */
.veil{position:fixed;inset:0;background:rgba(20,32,24,.42);backdrop-filter:blur(2px);z-index:800;display:none}
.veil.on{display:block}
.modal{position:fixed;z-index:820;left:50%;top:50%;transform:translate(-50%,-50%);width:880px;max-width:95vw;height:min(88vh,760px);
  background:var(--cream);border:1px solid var(--line);border-radius:18px;display:none;flex-direction:column;overflow:hidden;
  box-shadow:0 40px 90px -50px rgba(20,48,31,.7)}
.modal.on{display:flex}
.modal>header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;padding:18px 24px;border-bottom:1px solid var(--line);background:var(--card)}
.modal>header h2{font-size:20px}
.modal>header p{margin:3px 0 0;color:var(--muted);font-size:12.5px}
.mbody{flex:1;min-height:0;display:grid;grid-template-columns:206px minmax(0,1fr)}
.mside{border-right:1px solid var(--line);background:#FBF7EE;padding:14px 12px;overflow:auto;display:flex;flex-direction:column;gap:3px}
.mside button{display:grid;grid-template-columns:20px 1fr;gap:10px;align-items:center;text-align:left;border:0;background:none;
  padding:9px 10px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:600}
.mside button i{width:19px;height:19px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;
  font-style:normal;font-size:10px;font-weight:700;color:var(--muted);background:var(--card)}
.mside button:hover{background:var(--green-50)}
.mside button[aria-current="true"]{background:var(--green-100)}
.mside button[data-done="1"] i{background:var(--green);border-color:var(--green);color:#fff}
.mside .tip{margin-top:auto;border-top:1px solid var(--line);padding:12px 10px 4px;color:var(--muted);font-size:11.5px}
.mform{overflow:auto;padding:20px 24px 28px;display:flex;flex-direction:column;gap:22px;scroll-behavior:smooth}
.mform section{display:flex;flex-direction:column;gap:14px}
.mform section+section{border-top:1px solid var(--line);padding-top:20px}
.mform h3{font-size:16px}
.mform .lead{color:var(--muted);font-size:12.5px;margin:-6px 0 0}
.modal>footer{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--line);background:var(--card)}
.modal>footer .l{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12.5px}
.modal>footer .r{display:flex;gap:10px}
.drawer{position:fixed;z-index:820;top:0;right:0;height:100vh;width:470px;max-width:95vw;background:var(--cream);
  border-left:1px solid var(--line);transform:translateX(101%);transition:transform .24s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer>header{padding:20px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:14px;align-items:flex-start;background:var(--card)}
.drawer>header h2{font-size:19px}
.dbody{overflow:auto;padding:20px 22px 28px;display:flex;flex-direction:column;gap:16px}
.drawer>footer{margin-top:auto;border-top:1px solid var(--line);padding:14px 22px;display:flex;gap:10px;background:var(--card)}
.x{border:0;background:none;font-size:18px;color:var(--muted);cursor:pointer;line-height:1;padding:4px}

/* chips / opciones */
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer}
.opts button:hover{border-color:var(--green)}
.opts button[aria-pressed="true"]{background:var(--green-50);border-color:var(--green);box-shadow:0 0 0 2px var(--green-100)}
.rrow{display:grid;gap:9px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:9px 10px}
.rrow input,.rrow select{border-color:transparent;background:#FDFBF5;padding:8px 10px;font-size:13px}
.switch{display:flex;justify-content:space-between;gap:14px;align-items:center;border:1px solid var(--line);background:var(--card);
  border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left;width:100%}
.switch b{display:block;font-size:13px}
.switch small{color:var(--muted);font-size:11.5px}
.switch i{width:38px;height:22px;border-radius:99px;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch i:after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.switch[aria-pressed="true"] i{background:var(--green)}
.switch[aria-pressed="true"] i:after{left:19px}
.chk{display:flex;justify-content:space-between;gap:14px;align-items:center;border-bottom:1px solid var(--line-2);padding:10px 0;
  background:none;border-left:0;border-right:0;border-top:0;width:100%;text-align:left;cursor:pointer;font-size:13px}
.chk i{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex:none;display:grid;place-items:center;background:var(--card)}
.chk i svg{stroke:transparent;width:13px;height:13px}
.chk[aria-pressed="true"] i{background:var(--green);border-color:var(--green)}
.chk[aria-pressed="true"] i svg{stroke:#fff}

/* permisos */
.permgrp{border:1px solid var(--line);border-radius:12px;background:var(--card);padding:14px 16px}
.permgrp .gt{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.permgrp .gt b{font-size:14px}
.permrow{display:flex;justify-content:space-between;gap:14px;align-items:center;border-top:1px solid var(--line-2);padding:9px 0;font-size:12.5px}
.permrow span{color:var(--muted)}
.pmk{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none;border:1.5px solid var(--line);background:#FDFBF5}
.pmk svg{width:13px;height:13px;stroke:transparent}
.pmk.y{background:var(--green);border-color:var(--green)}
.pmk.y svg{stroke:#fff}
.rolecard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.rolecard .rt{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.rolecard h3{font-size:16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rolecard p{margin:0;color:var(--muted);font-size:12.5px}
.rolecard .mt{display:flex;gap:14px;color:var(--muted);font-size:12px}

/* newsletter / reseñas / config */
.mail{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.prev{position:sticky;top:70px;background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.prev .ph{padding:14px 16px;border-bottom:1px solid var(--line-2)}
.prev .ph b{display:block;font-size:15px;margin-top:6px}
.prev .pb{padding:16px;font-size:12.5px;color:var(--muted);min-height:140px;white-space:pre-wrap}
.prev .pf{border-top:1px solid var(--line-2);padding:11px 16px;color:var(--muted);background:#FDFBF5}
.rev{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:start;padding:16px 18px;border-bottom:1px solid var(--line-2)}
.rev:last-child{border-bottom:0}
.rev .stars{color:var(--warn);letter-spacing:.14em;font-size:13px}
.rev h4{font-size:14.5px;margin-top:5px}
.rev p{margin:6px 0 0;color:var(--muted);font-size:13px;max-width:76ch}

}

const menu = document.getElementById('menu');
function openMenu(btn,title,items){
  menu.innerHTML = `<div class="mh mono">${esc(title)}</div>`+items.map((it,i)=>
    `<button data-mi="${i}" class="${it.danger?'danger':''}">${it.icon}<span>${esc(it.label)}</span></button>`).join('');
  menu.classList.add('on');
  const r = btn.getBoundingClientRect(), w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.max(10,Math.min(r.right-w,window.innerWidth-w-10))+'px';
  menu.style.top = (r.bottom+h>window.innerHeight-10 ? r.top-h-6 : r.bottom+6)+'px';
  menu.onclick = ev => { const b = ev.target.closest('[data-mi]'); if(!b) return; menu.classList.remove('on'); items[+b.dataset.mi].run(); };
}
document.addEventListener('click',e=>{ if(!e.target.closest('#menu') && !e.target.closest('[data-menu]')) menu.classList.remove('on'); },true);

function keepFocus(id,fn){
  const el = document.getElementById(id), p = el.selectionStart; fn();
  const n = document.getElementById(id); if(n){ n.focus(); try{ n.setSelectionRange(p,p); }catch(e){} }

function sList(){
  let o = DEPS.filter(STABS.find(t=>t.k===SF.tab).f);
  if(SF.tour!=='all') o = o.filter(d=>d.tour===SF.tour);
  if(SF.q){ const q = SF.q.toLowerCase(); o = o.filter(d=>(d.tour+' '+d.code+' '+(d.guide||'')).toLowerCase().includes(q)); }
  return o.slice().sort((a,b)=>SF.sort==='asc'?dt(a.d)-dt(b.d):dt(b.d)-dt(a.d));
}

      <div class="tip">Los campos con <span class="req">*</span> son obligatorios. Puedes guardar un borrador y terminarla después.</div></nav>

    <footer><div class="l" id="mstat"></div><div class="r">

    if(q('[data-k="city"]')) q('[data-k="city"]').value = rec.city.split(',')[0]; }
  bindResModal(rec); veil.classList.add('on'); modal.classList.add('on');
  setTimeout(()=>modal.querySelector('input')?.focus(),80);
}
function bindResModal(rec){
  const form = document.getElementById('mform');
  const stat = () => {
    const req = [...form.querySelectorAll('.field')].filter(f=>f.querySelector('.req'));
    const ok = req.filter(f=>{ const el = f.querySelector('input,select,textarea'); return el && el.value.trim(); }).length;
    document.getElementById('mstat').innerHTML = `<span class="tag ${ok===req.length?'t-ok':'t-warn'}">${ok} de ${req.length} obligatorios</span>
      <span>El resto puede completarse luego.</span>`;
    document.getElementById('msave').disabled = ok < req.length;
    modal.querySelectorAll('[data-sec]').forEach(b=>{
      const sc = form.querySelector(`[data-sid="${b.dataset.sec}"]`);
      const r = [...sc.querySelectorAll('.field')].filter(f=>f.querySelector('.req'));
      b.dataset.done = (r.length && r.every(f=>{ const el = f.querySelector('input,select,textarea'); return el && el.value.trim(); }))?'1':'0';
    });
  };
  form.addEventListener('input',e=>{ if(e.target.dataset.hunt) hunt(e.target); stat(); });
  form.addEventListener('change',stat);
  form.addEventListener('click',e=>{
    const o = e.target.closest('[data-opt]');
    if(o){ if(o.dataset.opt==='tipo') o.parentElement.querySelectorAll('[data-opt]').forEach(b=>b.setAttribute('aria-pressed',b===o));
      else o.setAttribute('aria-pressed',o.getAttribute('aria-pressed')!=='true'); return; }
    const w = e.target.closest('[data-sw]'); if(w){ w.setAttribute('aria-pressed',w.getAttribute('aria-pressed')!=='true'); return; }
    const a = e.target.closest('[data-add]');
    if(a){ const box = form.querySelector(`[data-rep="${a.dataset.add}"]`), row = box.firstElementChild.cloneNode(true);
      row.querySelectorAll('input').forEach(i=>i.value=''); box.appendChild(row); return; }
    const d = e.target.closest('[data-del]');
    if(d){ const box = d.closest('[data-rep]'); if(box.children.length>1) d.closest('[data-rrow]').remove(); stat(); return; }
    const g = e.target.closest('[data-pickgeo]');

    else RES[mKind].unshift({id:'x'+Date.now(),n:g('n'),desc:g('desc')||'Ficha creada desde el panel.',
      city:[g('city'),g('dep')].filter(Boolean).join(', ')||'Sin ubicación',f,uses:0,on:true});

}
function hunt(input){

      <div class="rt"><div><h3>${esc(r.n)}${r.sys?'<span class="tag t-off">Solo lectura</span>':'<span class="tag t-ok">Propio</span>'}</h3>
        <div class="mt"><span>${cnt} de ${ALLP} permisos</span><span>${r.members} ${r.members===1?'miembro':'miembros'}</span></div></div></div>
      <div class="bar" style="max-width:220px"><i style="width:${Math.round(cnt/ALLP*100)}%"></i></div>
      <p>${esc(r.desc)}</p>
      <div style="display:flex;gap:8px;margin-top:2px">
        <button class="btn g sm" data-rview="${r.id}">${IC.eye} Ver permisos</button>
        ${r.sys?'':`<button class="btn g sm" data-redit="${r.id}">${IC.edit} Editar</button>`}</div></article>`; };
  return head('Roles y permisos','Qué puede hacer cada rol dentro del panel. Los del sistema son iguales para todas las agencias; los propios los defines tú.',
    `<button class="btn p" id="rnew">${IC.plus} Crear rol</button>`) +
  kpis([['Roles en uso',ROLES.length,'sistema y propios'],['Permisos disponibles',ALLP,'en 7 módulos'],
    ['Miembros con acceso',TEAM.filter(t=>t.on).length,'cuentas activas'],['Roles propios',own.length,'creados por la agencia']]) +
  `<div class="sec-title" style="margin-top:6px"><div><h2>Roles del sistema</h2>
     <p>Vienen con Montree. Puedes ver sus permisos, no modificarlos.</p></div>
     <span class="mono" style="color:var(--muted)">${sys.length} roles</span></div>
   <div class="cards">${sys.map(card).join('')}</div>
   <div class="sec-title"><div><h2>Roles propios de la agencia</h2>
     <p>Combinaciones de permisos que creas tú. Solo existen dentro de tu agencia.</p></div>
     <span class="mono" style="color:var(--muted)">${own.length} roles</span></div>
   ${own.length ? `<div class="cards">${own.map(card).join('')}</div>`
     : `<div class="empty"><b>Todavía no hay roles propios</b>
        Crea uno cuando necesites una combinación que los roles del sistema no cubren.
        <div style="margin-top:14px"><button class="btn g" id="rnew2">${IC.plus} Crear rol</button></div></div>`}`;
}
function bindRoles(){
  ['rnew','rnew2'].forEach(id=>{ const b = document.getElementById(id); if(b) b.onclick = () => openRoleModal(); });
  document.querySelectorAll('[data-rview]').forEach(b=>b.onclick=()=>openRoleDrawer(ROLES.find(r=>r.id===b.dataset.rview)));
  document.querySelectorAll('[data-redit]').forEach(b=>b.onclick=()=>openRoleModal(ROLES.find(r=>r.id===b.dataset.redit)));
}
function openRoleDrawer(r){
  const cnt = r.allow==='all'?ALLP:r.allow.length;
  drawer.innerHTML = `<header><div><span class="mono" style="color:var(--muted)">${r.sys?'Rol del sistema':'Rol propio'}</span>
      <h2 style="margin-top:3px">${esc(r.n)}</h2><p class="hint">${esc(r.desc)}</p>
      <div style="display:flex;gap:8px;margin-top:9px"><span class="tag t-ok">${cnt} de ${ALLP} permisos</span>
        <span class="tag t-off">${r.members} ${r.members===1?'miembro':'miembros'}</span></div></div>
      <button class="x" data-close aria-label="Cerrar">×</button></header>
    <div class="dbody">${r.sys?'<div class="note">Este rol lo administra Montree. Si necesitas otra combinación, duplícalo como rol propio.</div>':''}
      ${permTable(r)}</div>
    <footer>${r.sys?`<button class="btn g" id="rclone" style="flex:1;justify-content:center">${IC.copy} Duplicar como rol propio</button>`
      :`<button class="btn p" id="rgo" style="flex:1;justify-content:center">${IC.edit} Editar rol</button>`}
      <button class="btn g" data-close>Cerrar</button></footer>`;
  const c = document.getElementById('rclone'); if(c) c.onclick = () => { closeAll(); openRoleModal(null,r); };
  const g = document.getElementById('rgo'); if(g) g.onclick = () => { closeAll(); openRoleModal(r); };
  veil.classList.add('on'); drawer.classList.add('on');
}
function openRoleModal(rec,base){
  const src = rec||base;
  const draft = {allow: src ? (src.allow==='all'?Object.values(PERMS).flat().slice():src.allow.slice()) : ['Ver tours','Ver salidas']};
  modal.innerHTML = `<header><div><span class="mono" style="color:var(--muted)">Rol propio de la agencia</span>
      <h2 style="margin-top:3px">${rec?'Editar '+esc(rec.n):'Crear rol'}</h2>
      <p>Elige el nombre y marca exactamente lo que puede hacer.</p></div>
      <button class="x" data-close aria-label="Cerrar">×</button></header>
    <div class="mbody" style="grid-template-columns:minmax(0,1fr)">
      <form class="mform" onsubmit="return false">
        <section><div><h3>Identificación del rol</h3></div>
          <div class="g2"><div class="field"><label>Nombre <span class="req">*</span></label>
            <input id="rn" type="text" value="${rec?esc(rec.n):base?esc(base.n)+' (copia)':''}" placeholder="Coordinador de operación"></div>
            <div class="field"><label>Miembros con este rol</label><input type="text" value="${rec?rec.members:0}" disabled></div></div>
          <div class="field"><label>Para qué sirve</label>
            <textarea id="rd" rows="2" placeholder="Una línea que explique cuándo usar este rol">${rec?esc(rec.desc):base?esc(base.desc):''}</textarea></div></section>
        <section><div><h3>Permisos</h3><p class="lead" id="rcount"></p></div><div class="stack" id="rperms"></div></section>
      </form></div>
    <footer><div class="l"><button class="btn g sm" id="rall">Marcar todo</button><button class="btn g sm" id="rnone">Quitar todo</button></div>
      <div class="r"><button class="btn g" data-close>Cancelar</button>
        <button class="btn p" id="rsave">${IC.check} ${rec?'Guardar cambios':'Crear rol'}</button></div></footer>`;
  const paint = () => {
    document.getElementById('rperms').innerHTML = permTable({allow:draft.allow},true);
    document.getElementById('rcount').textContent = draft.allow.length+' de '+ALLP+' permisos marcados.';
    document.querySelectorAll('#rperms [data-perm]').forEach(b=>b.onclick=()=>{
      const p = b.dataset.perm, i = draft.allow.indexOf(p);
      i<0?draft.allow.push(p):draft.allow.splice(i,1); paint(); });
  };
  paint();
  document.getElementById('rall').onclick = () => { draft.allow = Object.values(PERMS).flat().slice(); paint(); };
  document.getElementById('rnone').onclick = () => { draft.allow = []; paint(); };
  document.getElementById('rsave').onclick = () => {
    const n = document.getElementById('rn').value.trim();
    if(!n){ toast('El rol necesita un nombre'); return; }
    const d = document.getElementById('rd').value.trim()||'Rol propio de la agencia.';
    if(rec) Object.assign(rec,{n,desc:d,allow:draft.allow});
    else ROLES.push({id:'r'+Date.now(),n,sys:false,members:0,allow:draft.allow,desc:d});
    closeAll(); render(); toast(rec?'Rol actualizado':'Rol creado');
  };
  veil.classList.add('on'); modal.classList.add('on');
}

/* ============ CONFIGURACIÓN ============ */
function vCfg(){
  return head('Configuración','Identidad, reglas de operación y enlaces que ven los viajeros.',
    `<button class="btn g" id="cdisc">Descartar</button><button class="btn p" id="csave">${IC.check} Guardar cambios</button>`) +
  `<div class="cfg"><div class="stack" style="gap:18px">
    <div class="card pad"><div class="sec-title" style="margin:0 0 14px"><div><h2>Identidad visual</h2>
      <p>Colores y mensajes que ven los viajeros en tu tienda.</p></div></div>
      <div class="stack">
        <div class="g2">
          <div class="field"><label>Color primario</label><div class="swatch"><span class="sw" id="sw1" style="background:${CFG.primary}"></span>
            <input type="text" id="c1" value="${CFG.primary}" style="font-family:'IBM Plex Mono',monospace"></div>
            <div class="hint">Botones de acción y enlaces destacados.</div></div>
          <div class="field"><label>Color secundario</label><div class="swatch"><span class="sw" id="sw2" style="background:${CFG.secondary}"></span>
            <input type="text" id="c2" value="${CFG.secondary}" style="font-family:'IBM Plex Mono',monospace"></div>
            <div class="hint">Acentos y elementos de soporte.</div></div></div>
        <div class="field"><label>Tagline</label><input type="text" id="ctag" value="${esc(CFG.tagline)}">
          <div class="hint">Máximo 160 caracteres.</div></div>
        <div class="field"><label>Descripción</label><textarea id="cdesc" rows="3">${esc(CFG.desc)}</textarea>
          <div class="hint">Máximo 2000 caracteres.</div></div></div></div>

    <div class="card pad"><div class="sec-title" style="margin:0 0 14px"><div><h2>Operación</h2>
      <p>Moneda, zona horaria y reglas de reserva.</p></div></div>
      <div class="stack"><div class="g3">
        <div class="field"><label>Moneda</label><select><option>COP — Peso colombiano</option><option>USD — Dólar</option><option>EUR — Euro</option></select></div>
        <div class="field"><label>Zona horaria</label><select><option>Bogotá (GMT-5)</option><option>Ciudad de México (GMT-6)</option><option>Madrid (GMT+2)</option></select></div>
        <div class="field"><label>Idioma</label><select><option>Español</option><option>English</option><option>Português</option></select></div></div>
        ${sw('Moderar reseñas antes de publicar','Las reseñas quedan en revisión hasta que las apruebas.',CFG.mod).replace('data-sw="1"','data-cfg="mod"')}
        ${sw('Requerir datos de cada viajero','Pide nombre, documento y contacto por persona al reservar.',CFG.datos).replace('data-sw="1"','data-cfg="datos"')}
      </div></div>

    <div class="card pad"><div class="sec-title" style="margin:0 0 14px"><div><h2>Redes sociales</h2>
      <p>Enlaces opcionales que aparecen en el pie del sitio.</p></div></div>
      <div class="stack">${[['ig','Instagram','https://instagram.com/tu-agencia'],['fb','Facebook','https://facebook.com/tu-agencia'],
        ['tw','Twitter / X','https://twitter.com/tu-agencia'],['yt','YouTube','https://youtube.com/@tu-agencia'],
        ['tk','TikTok','https://tiktok.com/@tu-agencia']].map(([k,l,ph])=>
        `<div class="field"><label>${l}</label><input type="text" data-soc="${k}" value="${esc(CFG[k])}" placeholder="${ph}"></div>`).join('')}</div></div>
  </div>
  <div class="store"><div class="hero" id="phero" style="background:${CFG.primary}">
      <span class="mono">Demo Eco Adventures</span><b id="ptag">${esc(CFG.tagline)}</b></div>
    <div class="cta"><span id="pc1" style="background:${CFG.primary}">Reservar ahora</span>
      <span id="pc2" style="background:${CFG.secondary}">Saber más</span></div>
    <div class="body" id="pdesc">${esc(CFG.desc)}</div>
    <div class="foot mono">Vista previa de la tienda pública</div></div></div>`;
}
function bindCfg(){
  const g = id => document.getElementById(id);
  const sync = () => {
    CFG.primary = g('c1').value; CFG.secondary = g('c2').value; CFG.tagline = g('ctag').value; CFG.desc = g('cdesc').value;
    g('sw1').style.background = CFG.primary; g('sw2').style.background = CFG.secondary;
    g('phero').style.background = CFG.primary; g('pc1').style.background = CFG.primary; g('pc2').style.background = CFG.secondary;
    g('ptag').textContent = CFG.tagline; g('pdesc').textContent = CFG.desc;
  };
  ['c1','c2','ctag','cdesc'].forEach(id=>g(id).oninput = sync);
  document.querySelectorAll('[data-cfg]').forEach(b=>b.onclick=()=>{
    const on = b.getAttribute('aria-pressed')!=='true'; b.setAttribute('aria-pressed',on); CFG[b.dataset.cfg] = on; });
  document.querySelectorAll('[data-soc]').forEach(i=>i.oninput=()=>CFG[i.dataset.soc]=i.value);
  g('csave').onclick = () => toast('Configuración guardada');
  g('cdisc').onclick = () => { render(); toast('Cambios descartados'); };
}

/* ============ vistas fuera de alcance ============ */
const vStub = (t,p) => head(t,p) + `<div class="empty"><b>Fuera de este prototipo</b>
  El rediseño en curso cubre Salidas, Logística, Promociones, Newsletter, Reseñas, Equipo, Roles y permisos y Configuración.</div>`;

/* ============ render ============ */
function render(){
  const box = document.getElementById('views');
  box.innerHTML = `<div class="page">${
    V==='salidas'?vSalidas():V==='logistica'?vLog():V==='promos'?vPromos():V==='news'?vNews():
    V==='revs'?vRevs():V==='equipo'?vTeam():V==='roles'?vRoles():V==='config'?vCfg():
    V==='dash'?vStub('Dashboard','Resumen operativo de la agencia.'):vStub('Tours','Catálogo de tours publicados.')
  }</div>`;
  ({salidas:bindSalidas,logistica:bindLog,promos:bindPromos,news:bindNews,revs:bindRevs,equipo:bindTeam,roles:bindRoles,config:bindCfg}[V]||(()=>{}))();
  box.querySelectorAll('[data-menu]').forEach(b=>b.onclick=e=>{
    e.stopPropagation(); const [kind,id] = b.dataset.menu.split(':');
    if(kind==='dep') depMenu(b,id); if(kind==='promo') promoMenu(b,id); if(kind==='team') teamMenu(b,id); });
}
go('salidas');
</script>
</body>
</html>
