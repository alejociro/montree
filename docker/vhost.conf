<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Logs a la salida estandar del contenedor (Railway los captura)
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
